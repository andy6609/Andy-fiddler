# Windows build and tests on a GitHub-hosted runner (real Windows, MSVC, vcpkg).
# What this does NOT cover: Npcap live capture (the runner has no Npcap driver), interactive
# trust-store prompts, or real AI clients. See docs/WINDOWS.md for the verified/unverified split.
name: windows

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC build + tests
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Test tools (Python h2, curl with OpenSSL-family TLS + HTTP/2, openssl CLI)
        run: |
          python -m pip install --disable-pip-version-check --quiet h2
          # Windows' System32 curl and (as of image 20260925) Git's curl are Schannel-only builds without HTTP/2;
          # Schannel also fails revocation checks for a local CA. Use the official curl for Windows build instead.
          Invoke-WebRequest -Uri 'https://curl.se/windows/latest.cgi?p=win64-mingw.zip' -OutFile "$env:RUNNER_TEMP\curl.zip"
          Expand-Archive "$env:RUNNER_TEMP\curl.zip" -DestinationPath "$env:RUNNER_TEMP\curl"
          $curl = (Get-ChildItem "$env:RUNNER_TEMP\curl" -Recurse -Filter curl.exe | Select-Object -First 1).FullName
          $features = (& $curl -V) -join "`n"
          if ($features -notmatch 'HTTP2' -or $features -notmatch '(OpenSSL|LibreSSL|BoringSSL|quictls)') { throw "curl lacks HTTP/2 or OpenSSL-family TLS:`n$features" }
          $openssl = @('C:\Program Files\Git\mingw64\bin\openssl.exe', 'C:\Program Files\Git\usr\bin\openssl.exe', 'C:\Program Files\OpenSSL\bin\openssl.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          & $curl -V
          & $openssl version
          cmake --version
          "CURL_EXE=$($curl -replace '\\','/')" >> $env:GITHUB_ENV
          "OPENSSL_EXE=$($openssl -replace '\\','/')" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$((Resolve-Path .vcpkg-cache).Path)" >> $env:GITHUB_ENV
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "::notice title=Runner::$($os.Caption) $($os.Version) · image $env:ImageVersion · $((& $curl -V | Select-Object -First 1)) · $(& $openssl version)"

      # restore/save split: the vcpkg packages (OpenSSL takes minutes) are kept even when a later step fails.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (vcpkg builds OpenSSL and nghttp2 on a cache miss)
        run: >
          cmake --preset windows-msvc
          "-DCURL_EXECUTABLE=$env:CURL_EXE"
          "-DOPENSSL_EXECUTABLE=$env:OPENSSL_EXE"
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: |
          cmd /c "cmake --build --preset windows-release --parallel > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log
          python .github/ci_annotate.py build build.log
          exit $code

      - name: Test (core, integration, lab)
        run: |
          cmd /c "ctest --preset windows-release -V > ctest.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content ctest.log
          python .github/ci_annotate.py test ctest.log
          exit $code

      # The user-facing script, so it is exercised too (configure/build are no-ops by now; it installs and zips).
      - name: Package with scripts/build-windows.ps1
        run: |
          .\scripts\build-windows.ps1 -Test none -Package
          Get-ChildItem dist/WireScope -Recurse -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path dist/WireScope).Path.Length + 1) }
          $files = (Get-ChildItem dist/WireScope -Recurse -File | ForEach-Object { $_.Name }) -join ', '
          Write-Host "::notice title=Package::$files"

      - uses: actions/upload-artifact@v4
        with:
          name: WireScope-windows-x64
          path: dist/WireScope-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            ctest.log
          if-no-files-found: ignore
